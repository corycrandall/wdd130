<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Images of Christ</title>
    /* Added Additional Fonts for title */
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@500&display=swap" rel="stylesheet">
    <style>
        body {
            background: black;
        }
        #wrapper{
            width: 600px;
            margin: 0 auto;
        }
        nav { /* Changed Font Selection */
            color: white;
            text-align: center;
            font-family: 'Cinzel', 'Trajan Pro', 'Palatino Linotype', Georgia, serif;
        }
        nav h1 {
            font-weight: 500;
            letter-spacing: 0.12em;
        }
        #gallery{
            display: grid;
            grid-template-columns: 200px 200px 200px;
            border: 15px solid rgb(255, 255, 255);
            width: 100%;
            background-color: #111;
        }
        #gallery a {
            cursor: url('images/christus.png'), pointer;
        }
        #gallery img {
            /* make a thumbnail of the image that is 200x300 
               instead of using width and height here to help the page load faster */
            width: 200px; 
            height: 300px;
            /* Modified how the pictures are faded before hovering */
            display:block;
            filter: brightness(55%) saturate(80%);
            transition: filter 0.3s ease;
        }
        #gallery img:hover{
            filter: brightness(100%) saturate(100%);
        }
    </style>
</head>
<body>
    <div id="wrapper">
        <nav>
            <h1>Christ Art Gallery</h1>
        </nav>
        <main>
            <div id="gallery">
                <a href="images/big/img1.jpg"><img src="images/small/img1.jpg" alt="Christ praying with the Nephites" ></a>
                <a href="images/big/img2.jpg"><img src="images/small/img2.jpg" alt="Jesus the Christ" ></a>
                <a href="images/big/img3.jpg"><img src="images/small/img3.jpg" alt="Jesus Raising the Daughter of Jairus" ></a>
                <a href="images/big/img4.jpg"><img src="images/small/img4.jpg" alt="The Lord Appears in the Kirtland Temple" ></a>
                <a href="images/big/img5.jpg"><img src="images/small/img5.jpg" alt="Crucifixion of Jesus Christ" ></a>
                <a href="images/big/img6.jpg"><img src="images/small/img6.jpg" alt="Jesus Calms the Storm" ></a>
            </div>
        </main>
    </div>
</body>
</html>
