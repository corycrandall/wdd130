<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Daily Feed Sign Up</title>

    <style>
        * {
            margin: 0;
            box-sizing: border-box;
        }

        body { /* Softened the background brown a bit */
            background: #aa9988;
            padding: 20px;
        }

                #formContainer {
            position: relative;
            width: 100%;
            max-width: 525px;
            margin: 0 auto;
            background: white;
            border: 12px solid #0f2f87;
            border-radius: 40px;
            overflow: hidden;
        }

        
        .hero {
            height: 200px;
            background: url("./images/jesus_feeds_5000.jpeg") center 25% / cover no-repeat;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: flex-end;
            padding-bottom: 14px;
            color: white;
            text-align: center;
            text-shadow:
                2px 2px 2px black,
                -1px -1px 1px black,
                1px -1px 1px black,
                -1px 1px 1px black;
        }

        .hero h1 {
            font-size: 2.4rem;
            line-height: 1.1;
        }

        .hero h2 {
            font-size: 2rem;
            font-weight: normal;
            line-height: 1.1;
        }

        #closeBtn {
            position: absolute;
            top: 12px;
            left: 12px;
            z-index: 1;
            font-size: 1.1rem;
            padding: 3px 10px;
            cursor: pointer;
        }

        #formContainer>h3 {
            text-align: center;
            margin-top: 20px;
        }

        #myForm { /* Centered the form a little for closer readability */
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 20px 10px;
            align-items: center;
            padding: 20px 100px 20px;
        }

        #myForm input[type="text"],
        #myForm input[type="password"],
        #myForm input[type="email"] {
            width: 100%;
            transition: background-color 0.2s ease;
        }

        /* Soft beige highlight when hovering over an input field */
        #myForm input[type="text"]:hover,
        #myForm input[type="password"]:hover,
        #myForm input[type="email"]:hover {
            background-color: #efefde;
        }

        #myForm section {
            grid-column: 1 / -1;
            text-align: center;
        }

        .books {
            display: flex;
            gap: 4px;
            height: 125px;
            background: white;
        }

        .books img {
            flex: 1;
            min-width: 0;
            height: 100%;
            object-fit: cover;
            object-position: top;
        }

        #output {
            max-width: 525px;
            margin: 20px auto 0;
            padding: 0 12px;
            color: white;
        }
    </style>
</head>

<body>
    <div id="formContainer">
        <div class="hero">
            <h1>Daily Feed</h1>
            <h2>Scripture a Day</h2>
        </div>

        <h3>Sign Up for Daily Scripture Feed</h3>
        <form id="myForm">
            <button type="button" id="closeBtn">X</button>
            <label for="username">User Name:</label>
            <input type="text" id="username" name="username" required>

            <label for="password">Password:</label>
            <input type="password" id="password" name="password" required>

            <label for="email">Email:</label>
            <input type="email" id="email" name="email" required>

            <label>Gender:</label>
            <div>
                <input type="radio" id="male" name="gender" value="male" required>
                <label for="male">Male</label>
                <input type="radio" id="female" name="gender" value="female" required>
                <label for="female">Female</label>
            </div>

            <section>
                <input type="checkbox" id="newsletter" name="newsletter">
                <label for="newsletter">Subscribe to newsletter</label>
            </section>

            <section>
                <input type="checkbox" id="conditions" name="conditions" required>
                <label for="conditions">I acknowledge the terms and conditions</label>
            </section>

            <section>
                <button type="submit">Submit</button>
            </section>
        </form>

        <div class="books">
            <img src="./images/old_testament.webp" alt="Old Testament">
            <img src="./images/new_testament.webp" alt="New Testament">
            <img src="./images/book_of_mormon.webp" alt="Book of Mormon">
            <img src="./images/doctrine_and_covenants.webp" alt="Doctrine and Covenants">
            <img src="./images/pearl_of_great_price.webp" alt="Pearl of Great Price">
        </div>
    </div>

    <div id="output"></div>

    <script>
        // Here is some Javascript to start looking forward to wdd131
        document.getElementById("closeBtn").addEventListener("click", function () {
            document.getElementById("formContainer").style.display = "none";
        });
        const form = document.getElementById('myForm');
        const output = document.getElementById('output');

        form.addEventListener('submit', function (event) {
            event.preventDefault(); // Stop form from actually submitting

            const formData = new FormData(form);
            const entries = [];

            for (const [key, value] of formData.entries()) {
                if (key == "password") {
                    entries.push(`<strong>${key}</strong>: ${value} (you should probably encrypt the password)`);
                } else {
                    entries.push(`<strong>${key}</strong>: ${value}`);
                }
            }

            output.innerHTML = `
            <br>  
            <h3>Here is the data that would be sent to the server:</h3>
            <ul>
                ${entries.map(item => `<li>${item}</li>`).join('')}
            </ul>
            `;
        });
    </script>

</body>

</html>
